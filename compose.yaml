# The default demo has no model service and never downloads model weights.
name: document-evidence-recorded
services:
  weaviate:
    image: semitechnologies/weaviate:1.38.2
    ports: ["127.0.0.1:${VECTOR_PORT:-8097}:8080"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: recorded
      DISABLE_TELEMETRY: 'true'
      GOMAXPROCS: 2
    volumes: ["vectors:/var/lib/weaviate"]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8080/v1/.well-known/ready]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  vectors:
