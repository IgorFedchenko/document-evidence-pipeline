[project]
name = "document-evidence-pipeline"
version = "0.1.0"
description = "Local document intelligence with verifiable page evidence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.118,<1", "uvicorn>=0.37,<1", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pydantic-settings>=2.10,<3", "pypdfium2>=4.30,<6",
  "pytesseract>=0.3.13,<1", "Pillow>=11.3,<13", "fastembed>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1", "reportlab>=4.4,<5"]
aws = ["boto3>=1.40,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["integration: requires a running Weaviate", "ocr: real local Tesseract"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
